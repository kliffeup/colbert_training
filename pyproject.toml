[project]
name = "colbert-training"
version = "0.1.0"
description = "ColBERTv2 training, indexing, and evaluation on MS MARCO, BEIR, and LoTTE"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "tensorboard>=2.13",
    "wandb>=0.15",
    "requests>=2.28",
    "pytrec-eval-terrier>=0.5",
    "beir>=2.0",
    "fastkmeans>=0.5.0",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[project.optional-dependencies]
flash-attn = ["flash-attn>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["colbert*"]
